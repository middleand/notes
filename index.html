<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>多功能筆記本</title>
<style>
:root{
  --bg:#f6f7fb; --panel:#fff; --text:#1c2333; --sub:#6b7385;
  --line:#e4e7ef; --accent:#3b6cff; --accent-soft:#e8efff;
  --save:#2fad60; --warn:#f88f1b; --shadow:0 8px 24px rgba(20,30,60,.08);
}
[data-theme="dark"]{
  --bg:#0f1420; --panel:#182033; --text:#e9edf6; --sub:#8f98ad;
  --line:#2a3348; --accent:#5b84ff; --accent-soft:#22304d;
  --shadow:0 8px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;
  background:var(--bg);color:var(--text);display:flex;flex-direction:column;
  height:100vh;height:100dvh;overflow:hidden;transition:background .25s,color .25s}

/* Top bar */
header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel);
  border-bottom:1px solid var(--line);box-shadow:var(--shadow);z-index:5;
  padding-top:calc(10px + env(safe-area-inset-top))}
header .logo{font-weight:800;font-size:17px;letter-spacing:.5px;white-space:nowrap}
header .logo span{color:var(--accent)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;
  padding:7px 11px;font-size:15px;cursor:pointer;display:flex;align-items:center;gap:5px;
  transition:transform .08s,background .2s;white-space:nowrap}
.btn:active{transform:scale(.94)}
.btn:hover{background:var(--accent-soft)}
.btn .txt{font-size:12px;color:var(--sub);font-weight:600}
select#note{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:9px;
  padding:7px 9px;font-size:14px;max-width:42vw;cursor:pointer}

/* Workspace */
main{flex:1;display:flex;min-height:0}

/* Sidebar */
aside{width:168px;min-width:168px;border-right:1px solid var(--line);background:var(--panel);
  overflow-y:auto;padding:10px 8px;transition:width .2s,opacity .2s}
aside h3{font-size:12px;color:var(--sub);margin:4px 6px 8px;letter-spacing:.5px}
aside .new{width:100%;text-align:left;padding:9px;border-radius:9px;border:1px dashed var(--line);
  background:transparent;color:var(--accent);font-weight:600;font-size:14px;cursor:pointer;margin-bottom:10px}
.item{padding:9px 10px;border-radius:9px;cursor:pointer;font-size:14px;margin-bottom:4px;
  border:1px solid transparent}
.item:hover{background:var(--accent-soft)}
.item.active{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.item .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.item .d{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.empty{font-size:13px;color:var(--sub);padding:6px 10px}

/* Editor */
.editor{flex:1;display:flex;flex-direction:column;min-width:0}
.note-title{padding:12px 16px 0;font-size:20px;font-weight:800;border:none;outline:none;background:transparent;color:var(--text);width:100%}
textarea#body{flex:1;padding:10px 16px;border:none;outline:none;resize:none;background:transparent;color:var(--text);
  font-family:inherit;line-height:1.7;min-height:0}

/* Status bar */
footer{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);
  border-top:1px solid var(--line);font-size:12px;color:var(--sub);
  padding-bottom:calc(8px + env(safe-area-inset-bottom))}
footer .grow{flex:1}
.save-dot{font-weight:700}
.save-dot.saved{color:var(--save)}
.save-dot.pending{color:var(--warn)}
.tool{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;
  padding:5px 9px;font-size:13px;font-weight:700;cursor:pointer}
.tool:active{transform:scale(.93)}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,14,25,.5);display:none;align-items:center;justify-content:center;z-index:50}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border-radius:16px;padding:18px;width:88%;max-width:340px;box-shadow:var(--shadow)}
.modal h4{margin:0 0 12px;font-size:16px}
.modal .row{display:flex;gap:8px;flex-wrap:wrap}
.modal .row .btn{flex:1;justify-content:center}

@media (max-width:600px){
  aside{width:128px;min-width:128px}
}
</style>
</head>
<body>
<header>
  <div class="logo">✎ <span>多功能</span> 筆記本</div>
  <div class="spacer"></div>
  <button class="btn" id="btnTheme" title="日夜切換">🌙 <span class="txt">模式</span></button>
  <button class="btn" id="btnFont" title="字級">Aa <span class="txt">字級</span></button>
  <button class="btn" id="btnCloud" title="雲端同步">☁️ <span class="txt">雲端</span></button>
  <button class="btn" id="btnMore" title="更多">⋯</button>
</header>

<main>
  <aside id="sidebar">
    <h3>我的筆記</h3>
    <button class="new" id="btnNew">＋ 新增筆記</button>
    <div id="list"></div>
  </aside>

  <div class="editor">
    <input id="title" class="note-title" placeholder="標題" autocomplete="off">
    <textarea id="body" placeholder="在這裡開始記下想法…" spellcheck="false"></textarea>
  </div>
</main>

<footer>
  <button class="tool" id="fontDown" title="縮小">A−</button>
  <button class="tool" id="fontUp" title="放大">A＋</button>
  <span id="fontSize">16px</span>
  <button class="tool" id="btnSave" title="儲存（本地＋雲端）" style="font-size:15px;padding:5px 14px;border-color:var(--accent);color:var(--accent)">💾 儲存</button>
  <span class="save-dot saved" id="saveDot">已儲存</span>
  <div class="grow"></div>
  <span id="wordCount">0 字</span>
  <button class="tool" id="btnExport" title="匯出">⤓</button>
  <button class="tool" id="btnDelete" title="刪除">🗑</button>
</footer>

<!-- 匯出 / 匯入 modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h4 id="modalTitle">操作</h4>
    <div class="row">
      <button class="btn" id="modalOk">確認</button>
      <button class="btn" id="modalCancel">取消</button>
    </div>
  </div>
</div>

<script>
(function(){
  var KEY='notepad.data.v1';
  var THEME_KEY='notepad.theme';
  var FONT_KEY='notepad.font';
  var CLOUD_KEY='notepad.cloud';
  // Supabase 雲端同步（ anon 等級，公開可讀寫）
  var SB_URL='https://yatsoejytdrscwrovpgf.supabase.co';
  var SB_KEY='sb_publishable_x4oh6CfucTug7s6eFKnB7w_S_yyUXUv';
  var SB_TABLE='notes';
  var OWNER='me';
  var cloudOn=false;
  var notes=[];        // [{id,title,body}]
  var currentId=null;
  var fontSize=16;
  var saveTimer=null;

  // ---------- load ----------
  function load(){
    var raw=null;
    try{ raw=localStorage.getItem(KEY); }catch(e){}
    if(raw){
      var parsed=JSON.parse(raw);
      if(Array.isArray(parsed)) notes=parsed;
    }
    var t=null; try{t=localStorage.getItem(THEME_KEY)}catch(e){}
    if(!t){ t=(matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'; }
    applyTheme(t);
    fontSize=parseInt(localStorage.getItem(FONT_KEY)||'16',10)||16;
    applyFont();
  }

  function persist(){
    persistLocalOnly();
    if(cloudOn) syncToCloud();
  }
  function persistLocalOnly(){
    localStorage.setItem(KEY,JSON.stringify(notes));
    localStorage.setItem(FONT_KEY,String(fontSize));
  }

  // ---------- cloud (Supabase) ----------
  function sbHeaders(){
    return {
      'apikey': SB_KEY,
      'Authorization': 'Bearer '+SB_KEY,
      'Content-Type': 'application/json'
    };
  }
  function syncToCloud(){
    // 逐筆 upsert（id 為 uuid 主鍵），本地為準，不再全刪全寫
    if(!notes.length){ setCloudDot('cloud:ok'); return; }
    var rows=notes.map(function(n){return {id:n.id,title:n.title||'',body:n.body||'',owner:OWNER,updated_at:new Date().toISOString()}});
    fetch(SB_URL+'/rest/v1/'+SB_TABLE,{
      method:'POST',
      headers:Object.assign(sbHeaders(),{'Prefer':'resolution=merge-duplicates,return=minimal'}),
      body:JSON.stringify(rows)
    }).then(function(r){
      setCloudDot(r.ok?'cloud:ok':'cloud:fail');
    }).catch(function(){ setCloudDot('cloud:fail'); });
  }
  function loadFromCloud(){
    return fetch(SB_URL+'/rest/v1/'+SB_TABLE+'?owner=eq.'+encodeURIComponent(OWNER)+'&select=id,title,body,updated_at',{headers:sbHeaders()})
      .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
      .then(function(rows){
        // 合併：以 updated_at 較新者為準（雲端端與本地端比對）
        var map={};
        notes.forEach(function(n){ map[n.id]=n; });
        rows.forEach(function(rw){
          var local=map[rw.id];
          if(!local){
            notes.push({id:rw.id,title:rw.title||'',body:rw.body||''});
          } else {
            // 本地沒有記錄到 updated_at，一律以雲端端為準做備份同步
            if(local.title!==rw.title || local.body!==rw.body){
              local.title=rw.title||''; local.body=rw.body||'';
            }
          }
        });
        persistLocalOnly();
      })
      .catch(function(){ setCloudDot('cloud:fail'); });
  }
  // 同步删除：将本地已删除的笔记从云端移除
  function syncDeletedToCloud(deletedIds){
    if(!deletedIds.length || !cloudOn) return Promise.resolve();
    var ids=deletedIds.join(',');
    return fetch(SB_URL+'/rest/v1/'+SB_TABLE+'?id=in.('+encodeURIComponent(ids)+')',{
      method:'DELETE',
      headers:Object.assign(sbHeaders(),{'Prefer':'return=minimal'}),
      body:null
    }).catch(function(){ /* 静默失败，不影响本地 */ });
  }
  function setCloudDot(state){
    var dot=document.getElementById('saveDot');
    if(state==='cloud:ok'){ dot.textContent='雲端已同步'; dot.className='save-dot saved'; }
    else if(state==='cloud:fail'){ dot.textContent='雲端失敗'; dot.className='save-dot pending'; }
  }
  function toggleCloud(){
    cloudOn=!cloudOn;
    localStorage.setItem(CLOUD_KEY,cloudOn?'1':'0');
    var b=document.getElementById('btnCloud');
    b.style.outline = cloudOn?'2px solid var(--accent)':'none';
    if(cloudOn){
      loadFromCloud().then(function(){
        // 合併後把雲端端拉下來寫入本地，再推回雲端端確認一致
        persist();
        renderList();
      });
    }
  }
  document.getElementById('btnCloud').addEventListener('click',toggleCloud);

  // ---------- theme ----------
  function applyTheme(t){
    document.body.setAttribute('data-theme',t);
    var b=document.getElementById('btnTheme');
    b.firstChild.textContent = (t==='dark')?'☀️':'🌙';
  }
  document.getElementById('btnTheme').addEventListener('click',function(){
    var cur=document.body.getAttribute('data-theme');
    var next=(cur==='dark')?'light':'dark';
    applyTheme(next);
    localStorage.setItem(THEME_KEY,next);
  });

  // ---------- font ----------
  function applyFont(){
    document.getElementById('body').style.fontSize=fontSize+'px';
    document.getElementById('title').style.fontSize=(fontSize*1.25)+'px';
    document.getElementById('fontSize').textContent=fontSize+'px';
  }
  function changeFont(delta){
    fontSize=Math.max(11,Math.min(30,fontSize+delta));
    applyFont();
    localStorage.setItem(FONT_KEY,String(fontSize));
  }
  document.getElementById('btnFont').addEventListener('click',function(){
    // 循環：在常用字級間切換
    var steps=[14,16,18,20,24];
    var i=steps.indexOf(fontSize);
    fontSize=steps[(i+1+steps.length)%steps.length];
    applyFont();
    localStorage.setItem(FONT_KEY,String(fontSize));
  });
  document.getElementById('fontDown').addEventListener('click',function(){changeFont(-1)});
  document.getElementById('fontUp').addEventListener('click',function(){changeFont(1)});

  // 手動儲存按鈕：存本地（若雲端開著也推雲端）＋閃提示
  document.getElementById('btnSave').addEventListener('click',function(){
    saveCurrent();
    var dot=document.getElementById('saveDot');
    dot.textContent=cloudOn?'雲端已同步':'已儲存';
    dot.className='save-dot saved';
  });

  // ---------- notes CRUD ----------
  function uid(){
    // 合法 uuid v4（匹配 Supabase notes.id 型別），避免非 uuid 字串寫入失敗
    if(crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
      var r=Math.random()*16|0, v=c==='x'?r:(r&0x3|0x8); return v.toString(16);
    });
  }
  function findNote(id){return notes.find(function(n){return n.id===id})}

  function newNote(){
    var n={id:uid(),title:'',body:''};
    notes.unshift(n);
    currentId=n.id;
    persist();
    renderList();
    loadIntoEditor(n);
    document.getElementById('title').focus();
  }
  document.getElementById('btnNew').addEventListener('click',newNote);

  function openNote(id){
    var n=findNote(id); if(!n)return;
    currentId=id;
    loadIntoEditor(n);
    renderList();
  }

  function loadIntoEditor(n){
    document.getElementById('title').value=n.title;
    document.getElementById('body').value=n.body;
    updateCount();
  }

  function updateCount(){
    var b=document.getElementById('body').value;
    var w=b.replace(/\s+/g,'').length;
    document.getElementById('wordCount').textContent=w+' 字';
  }

  function markDirty(){
    var dot=document.getElementById('saveDot');
    dot.textContent='輸入中…'; dot.className='save-dot pending';
    clearTimeout(saveTimer);
    saveTimer=setTimeout(saveCurrent,500);
  }
  function saveCurrent(){
    if(!currentId)return;
    var n=findNote(currentId); if(!n)return;
    n.title=document.getElementById('title').value;
    n.body=document.getElementById('body').value;
    persist();
    var dot=document.getElementById('saveDot');
    dot.textContent='已儲存'; dot.className='save-dot saved';
    renderList();
  }

  document.getElementById('title').addEventListener('input',markDirty);
  document.getElementById('body').addEventListener('input',function(){updateCount();markDirty()});

  function deleteNote(){
    if(!currentId)return;
    var n=findNote(currentId);
    var title=n.title||'(無標題)';
    showConfirm('刪除筆記', '確定要刪除「'+title+'」？此操作無法復原。', function(){
      notes=notes.filter(function(x){return x.id!==currentId});
      persist();
      // 同步删除到云端
      syncDeletedToCloud([currentId]).then(function(){
        if(notes.length){ openNote(notes[0].id); }
        else { currentId=null; newNote(); }
      });
    });
  }
  document.getElementById('btnDelete').addEventListener('click',deleteNote);

  // ---------- export / import ----------
  function exportAll(){
    var blob=new Blob([JSON.stringify(notes,null,2)],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download='notepad-export-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }
  document.getElementById('btnExport').addEventListener('click',function(){
    if(!notes.length){alert('目前沒有筆記可匯出');return}
    showConfirm('匯出全部筆記','將匯出 '+notes.length+' 筆筆記為 JSON 檔案。',function(){exportAll()});
  });

  // ---------- more menu (import) ----------
  var importHandler=null;
  document.getElementById('btnMore').addEventListener('click',function(){
    importHandler=function(){importAll()};
    showConfirm('匯入 JSON','選擇一個先前匯出的 notepad JSON 檔以還原筆記。',function(){
      var inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
      inp.onchange=function(e){
        var f=e.target.files[0]; if(!f)return;
        var r=new FileReader();
        r.onload=function(){
          try{
            var data=JSON.parse(r.result);
            if(!Array.isArray(data))throw new Error('bad');
            var idmap={};
            data.forEach(function(n){
              if(n.title||n.body){
                if(notes.some(function(x){return x.id===n.id})){ idmap[n.id]=uid(); }
                else idmap[n.id]=n.id;
                notes.push({id:idmap[n.id],title:n.title||'',body:n.body||''});
              }
            });
            persist(); renderList();
            if(notes.length) openNote(notes[0].id);
            alert('匯入完成');
          }catch(err){ alert('檔案格式錯誤，無法匯入'); }
        };
        r.readAsText(f);
      };
      inp.click();
    });
  });

  // ---------- list render ----------
  function renderList(){
    var list=document.getElementById('list');
    if(!notes.length){ list.innerHTML='<div class="empty">尚無筆記<br>點「＋ 新增筆記」開始</div>'; return; }
    list.innerHTML='';
    notes.forEach(function(n){
      var div=document.createElement('div');
      div.className='item'+(n.id===currentId?' active':'');
      div.innerHTML='<div class="t">'+(esc(n.title)||'無標題')+'</div><div class="d">'+(esc(n.body).slice(0,30)||'空筆記')+'</div>';
      div.addEventListener('click',function(){openNote(n.id)});
      list.appendChild(div);
    });
  }
  function esc(s){return (s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

  // ---------- confirm modal ----------
  var modalBg=document.getElementById('modalBg');
  var modalOk=document.getElementById('modalOk');
  var modalCancel=document.getElementById('modalCancel');
  var modalTitle=document.getElementById('modalTitle');
  var modalMsg=document.getElementById('modalOk');
  var pendingConfirm=null;
  function showConfirm(title,msg,cb){
    modalTitle.textContent=title;
    modalOk.textContent='確認'; modalCancel.textContent='取消';
    // 顯示訊息：用一個暫時元素
    var box=modalOk.parentElement;
    var m=document.getElementById('modalMsg');
    if(!m){ m=document.createElement('p'); m.id='modalMsg'; m.style.cssText='margin:0 0 14px;font-size:14px;color:var(--sub);white-space:pre-wrap'; box.insertBefore(m,box.firstChild); }
    m.textContent=msg;
    pendingConfirm=cb;
    modalBg.classList.add('show');
  }
  modalOk.addEventListener('click',function(){
    modalBg.classList.remove('show');
    if(pendingConfirm){var cb=pendingConfirm;pendingConfirm=null;cb()}
  });
  modalCancel.addEventListener('click',function(){ modalBg.classList.remove('show'); pendingConfirm=null; });
  modalBg.addEventListener('click',function(e){ if(e.target===modalBg){ modalBg.classList.remove('show'); pendingConfirm=null; }});

  // ---------- keyboard ----------
  document.addEventListener('keydown',function(e){
    if((e.metaKey||e.ctrlKey)&&e.key==='s'){ e.preventDefault(); saveCurrent(); }
    if((e.metaKey||e.ctrlKey)&&e.key==='n'){ e.preventDefault(); newNote(); }
    if((e.metaKey||e.ctrlKey)&&e.key==='f'){ e.preventDefault(); changeFont(1); }
  });

  // ---------- init ----------
  load();
  cloudOn = localStorage.getItem(CLOUD_KEY)==='1';
  if(cloudOn){
    document.getElementById('btnCloud').style.outline='2px solid var(--accent)';
    // 先讀雲端再合併本地
    loadFromCloud().then(function(){
      persist();
      if(notes.length){ openNote(notes[0].id); } else { newNote(); }
      renderList();
    });
  } else {
    if(notes.length){ openNote(notes[0].id); renderList(); }
    else { newNote(); }
  }

  window.addEventListener('beforeunload',function(){ saveCurrent(); if(cloudOn) syncToCloud(); });
})();
</script>
</body>
</html>
